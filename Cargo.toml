[package]
name = "trash"
version = "0.4.0"
edition = "2024"
authors = ["Terrydaktal <9lewis9@gmail.com>"]
description = "Per-mountpoint, audit-friendly rm replacement"
repository = "https://github.com/Terrydaktal/trash"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
fs2 = "0.4.3"
getrandom = "0.3.4"
libc = "0.2.175"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
